<div class="forgot-password-container">
  <mat-card class="forgot-password-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
      <mat-card-subtitle>Enter your email to receive a password reset link</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form" *ngIf="!emailSent">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="emailId" placeholder="Enter your email" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="forgotPasswordForm.get('emailId')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('emailId')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">
          <mat-icon>error</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-button"
          [disabled]="loading || forgotPasswordForm.invalid"
        >
          <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
          <span *ngIf="!loading">Send Reset Link</span>
          <span *ngIf="loading">Sending...</span>
        </button>

        <div class="back-link">
          <button mat-button type="button" (click)="onBackToLogin()" color="primary">
            <mat-icon>arrow_back</mat-icon>
            Back to Login
          </button>
        </div>
      </form>

      <div class="success-message" *ngIf="emailSent">
        <mat-icon>check_circle</mat-icon>
        <h3>Email Sent!</h3>
        <p>{{ successMessage }}</p>
        <button mat-raised-button color="primary" (click)="onBackToLogin()" class="back-button">
          Back to Login
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
