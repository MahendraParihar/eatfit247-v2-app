<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>State</mat-label>
          <input
            matInput
            type="text"
            formControlName="state"
            placeholder="Enter state name"
            [maxlength]="50"
            [minlength]="2"
          />
          <mat-hint align="end">
            {{ formGroup.get('state')?.value?.length || 0 }}/50
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('state')" controlName="State"></shared-ui-input-error>
        </mat-form-field>

        <div class="row">
          <mat-form-field class="half-width">
            <mat-label>Code</mat-label>
            <input
              matInput
              type="text"
              formControlName="code"
              placeholder="Enter state code"
              [maxlength]="10"
              [minlength]="2"
            />
            <mat-hint align="end">
              {{ formGroup.get('code')?.value?.length || 0 }}/10
            </mat-hint>
            <shared-ui-input-error [control]="formGroup.get('code')" controlName="Code"></shared-ui-input-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Country</mat-label>
            <mat-select formControlName="countryId">
              <mat-option [value]="null">Select Country</mat-option>
              @for (country of countryOptions; track country.id) {
                <mat-option [value]="country.id">{{ country.label }}</mat-option>
              }
            </mat-select>
            <shared-ui-input-error [control]="formGroup.get('countryId')" controlName="Country"></shared-ui-input-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <shared-ui-input-error [control]="formGroup.get('active')" controlName="Status"></shared-ui-input-error>
        </mat-form-field>

      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
