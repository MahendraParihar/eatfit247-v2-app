<mat-card>
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Health Parameter Unit</mat-label>
          <input matInput formControlName="healthParameterUnit" placeholder="Enter health parameter unit" />
          <app-input-error [control]="formGroup.get('healthParameterUnit')"
                           controlName="healthParameterUnit"></app-input-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <app-input-error [control]="formGroup.get('active')" controlName="Active"></app-input-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-raised-button type="button" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Cancel
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="formGroup.invalid">
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
