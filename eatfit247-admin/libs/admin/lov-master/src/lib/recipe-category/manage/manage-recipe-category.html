<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>Recipe Category</mat-label>
          <input
            matInput
            type="text"
            formControlName="recipeCategory"
            placeholder="Enter recipe category"
            [maxlength]="50"
            [minlength]="2"
          />
          <mat-hint align="end">
            {{ formGroup.get('recipeCategory')?.value?.length || 0 }}/50
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('recipeCategory')" controlName="Recipe Category"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>From Time</mat-label>
          <input
            matInput
            type="time"
            formControlName="fromTime"
            placeholder="Enter from time"
          />
          <shared-ui-input-error [control]="formGroup.get('fromTime')" controlName="From Time"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>To Time</mat-label>
          <input
            matInput
            type="time"
            formControlName="toTime"
            placeholder="Enter to time"
          />
          <shared-ui-input-error [control]="formGroup.get('toTime')" controlName="To Time"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Sequence</mat-label>
          <input
            matInput
            type="number"
            formControlName="sequence"
            placeholder="Enter sequence"
            min="0"
          />
          <shared-ui-input-error [control]="formGroup.get('sequence')" controlName="Sequence"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <shared-ui-input-error [control]="formGroup.get('active')" controlName="Status"></shared-ui-input-error>
        </mat-form-field>

        <shared-ui-upload-form
          [formGroup]="formGroup"
          [isMultiFile]="false"
          [isRequired]="false"
          [uploadedMediaList]="initialData && initialData.imagePath ? initialData.imagePath : []"
          controlName="imagePath"
          [mediaFor]="mediaFor"
          [mediaType]="mediaType"
        ></shared-ui-upload-form>

      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
