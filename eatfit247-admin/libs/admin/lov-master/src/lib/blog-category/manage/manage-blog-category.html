<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>Blog Category</mat-label>
          <input
            matInput
            type="text"
            formControlName="blogCategory"
            placeholder="Enter blog category"
            [maxlength]="50"
            [minlength]="2"
          />
          <mat-hint align="end">
            {{ formGroup.get('blogCategory')?.value?.length || 0 }}/50
          </mat-hint>
          <app-input-error [control]="formGroup.get('blogCategory')" controlName="Blog Category"></app-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>URL</mat-label>
          <input
            matInput
            type="text"
            formControlName="url"
            placeholder="Enter URL (optional)"
            [maxlength]="200"
          />
          <mat-hint align="end">
            {{ formGroup.get('url')?.value?.length || 0 }}/200
          </mat-hint>
          <app-input-error [control]="formGroup.get('url')" controlName="URL"></app-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <app-input-error [control]="formGroup.get('active')" controlName="Status"></app-input-error>
        </mat-form-field>

        <app-upload-form
          [formGroup]="formGroup"
          [isMultiFile]="false"
          [isRequired]="false"
          [uploadedMediaList]="initialData && initialData.imagePath ? initialData.imagePath : []"
          controlName="imagePath"
          [mediaFor]="mediaFor"
          [mediaType]="mediaType"
        ></app-upload-form>

      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
