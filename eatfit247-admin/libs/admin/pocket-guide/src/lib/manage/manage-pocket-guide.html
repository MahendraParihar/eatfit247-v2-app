<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>Pocket Guide Title</mat-label>
          <input
            matInput
            formControlName="pocketGuide"
            placeholder="Enter pocket guide title"
            [maxlength]="50"
            [minlength]="2"
            required
          />
          <mat-hint align="end">
            {{ formGroup.get('pocketGuide')?.value?.length || 0 }}/50
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('pocketGuide')" controlName="Pocket Guide Title"></shared-ui-input-error>
        </mat-form-field>

        <div class="full-width">
          <label class="editor-label">Description</label>
          @if (editor) {
            <div class="NgxEditor__Wrapper">
              <ngx-editor-menu [editor]="editor"></ngx-editor-menu>
              <ngx-editor
                [editor]="editor"
                formControlName="description"
                placeholder="Enter description (optional)"
              ></ngx-editor>
            </div>
          }
          <shared-ui-input-error [control]="formGroup.get('description')" controlName="Description"></shared-ui-input-error>
        </div>

        <div class="full-width">
          <label class="upload-label">File (PDF/Document)</label>
          <shared-ui-upload-form
            [formGroup]="formGroup"
            [isMultiFile]="false"
            [isRequired]="false"
            [uploadedMediaList]="getFilePathList()"
            controlName="filePath"
            [mediaFor]="mediaFor"
            [mediaType]="fileMediaType"
          ></shared-ui-upload-form>
        </div>

        <div class="full-width">
          <label class="upload-label">Image</label>
          <shared-ui-upload-form
            [formGroup]="formGroup"
            [isMultiFile]="false"
            [isRequired]="false"
            [uploadedMediaList]="getImagePathList()"
            controlName="imagePath"
            [mediaFor]="mediaFor"
            [mediaType]="imageMediaType"
          ></shared-ui-upload-form>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <shared-ui-input-error [control]="formGroup.get('active')" controlName="Status"></shared-ui-input-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
