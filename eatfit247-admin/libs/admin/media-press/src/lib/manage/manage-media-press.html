<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Type</mat-label>
          <mat-select formControlName="type">
            <mat-option [value]="">Select Type</mat-option>
            @for (option of typeOptions; track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
          <app-input-error [control]="formGroup.get('type')" controlName="Type"></app-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Title</mat-label>
          <input
            matInput
            formControlName="title"
            placeholder="Enter title (optional)"
            [maxlength]="200"
          />
          <mat-hint align="end">
            {{ formGroup.get('title')?.value?.length || 0 }}/200
          </mat-hint>
          <app-input-error [control]="formGroup.get('title')" controlName="Title"></app-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Link</mat-label>
          <input
            matInput
            formControlName="link"
            placeholder="Enter link (YouTube URL or Press link)"
            [maxlength]="500"
            required
          />
          <mat-hint align="end">
            {{ formGroup.get('link')?.value?.length || 0 }}/500
          </mat-hint>
          <app-input-error [control]="formGroup.get('link')" controlName="Link"></app-input-error>
        </mat-form-field>

        <app-upload-form
          [formGroup]="formGroup"
          [isMultiFile]="false"
          [isRequired]="false"
          [uploadedMediaList]="initialData && initialData.imagePath ? initialData.imagePath : []"
          controlName="imagePath"
          [mediaFor]="mediaFor"
          [mediaType]="mediaType"
        ></app-upload-form>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <app-input-error [control]="formGroup.get('active')" controlName="Status"></app-input-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
