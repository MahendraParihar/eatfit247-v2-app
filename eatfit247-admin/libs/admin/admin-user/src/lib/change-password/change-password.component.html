<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Change Password</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current Password</mat-label>
          <input
            matInput
            [type]="hideCurrentPassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter current password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleCurrentPasswordVisibility()"
            [attr.aria-label]="'Hide current password'"
            [attr.aria-pressed]="hideCurrentPassword()">
            <mat-icon>{{ hideCurrentPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <shared-ui-input-error [control]="formGroup.get('password')" controlName="Current Password"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input
            matInput
            [type]="hideNewPassword() ? 'password' : 'text'"
            formControlName="newPassword"
            placeholder="Enter new password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleNewPasswordVisibility()"
            [attr.aria-label]="'Hide new password'"
            [attr.aria-pressed]="hideNewPassword()">
            <mat-icon>{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (getMaxLength('newPassword')) {
            <mat-hint align="end">
              {{ getCurrentLength('newPassword') }}/{{ getMaxLength('newPassword') }}
            </mat-hint>
          }
          <shared-ui-input-error [control]="formGroup.get('newPassword')" controlName="New Password"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm New Password</mat-label>
          <input
            matInput
            [type]="hideConfirmPassword() ? 'password' : 'text'"
            formControlName="repeatPassword"
            placeholder="Confirm new password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="'Hide confirm password'"
            [attr.aria-pressed]="hideConfirmPassword()">
            <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <shared-ui-input-error [control]="formGroup.get('repeatPassword')" controlName="Confirm Password"></shared-ui-input-error>
          @if (formGroup.get('repeatPassword')?.hasError('passwordMismatch')) {
            <mat-error>Passwords do not match</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()" [disabled]="submitting()">
          Cancel
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="submitting() || formGroup.invalid">
          @if (submitting()) {
            <mat-icon class="spinning">refresh</mat-icon>
            Changing...
          } @else {
            Change Password
          }
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
