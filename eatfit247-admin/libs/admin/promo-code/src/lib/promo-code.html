<div class="promo-code-container">
  <div class="header">
    <h1>Promo Codes</h1>
    <button mat-raised-button color="primary" (click)="navigateToCreate()">
      <mat-icon>add</mat-icon>
      Create Promo Code
    </button>
  </div>

  <shared-ui-data-table
    [config]="tableConfig"
    [data]="data"
    [loading]="loading"
    [totalCount]="totalCount"
    (searchChange)="onSearch($event)"
    (pageChange)="onPageChange($event.pageIndex, $event.pageSize)"
  ></shared-ui-data-table>
</div>
