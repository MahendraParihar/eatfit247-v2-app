<div class="list-container">
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="data"
    [totalCount]="totalCount"
    [loading]="loading"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)"
  >
    <div headerActions>
      <button mat-raised-button color="primary" (click)="createItem()">
        <mat-icon>add</mat-icon>
        Create New
      </button>
    </div>

    <ng-template #companyNameCell let-row let-value="value">
      <a
        class="company-name-link"
        [routerLink]="['/franchise/details', row.franchiseId, 'dashboard']"
        (click)="$event.stopPropagation()"
      >
        {{ value }}
      </a>
    </ng-template>
  </shared-ui-data-table>
</div>
