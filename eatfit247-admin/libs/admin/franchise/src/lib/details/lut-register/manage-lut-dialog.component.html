<h2 mat-dialog-title>{{ isEdit ? 'Edit LUT' : 'Add LUT' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="lut-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>ARN</mat-label>
      <input matInput formControlName="arn" placeholder="AD270326000123X" maxlength="15" />
      <mat-hint>Acknowledgement number of the LUT (RFD-11) on the GST portal</mat-hint>
      @if (form.controls.arn.hasError('pattern')) {
        <mat-error>15 characters starting with AD</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Financial year</mat-label>
      <input matInput formControlName="financialYear" placeholder="2026-27" maxlength="7" />
      @if (form.controls.financialYear.hasError('pattern')) {
        <mat-error>Use the form 2026-27</mat-error>
      }
    </mat-form-field>

    <div class="date-row">
      <mat-form-field appearance="outline">
        <mat-label>Valid from</mat-label>
        <input matInput type="date" formControlName="validFrom" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Valid to</mat-label>
        <input matInput type="date" formControlName="validTo" />
      </mat-form-field>
    </div>
    <button mat-button type="button" class="whole-year" (click)="useWholeYear()">Use the whole financial year</button>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" [disabled]="saving()" (click)="save()">
    {{ isEdit ? 'Save' : 'Add' }}
  </button>
</mat-dialog-actions>
