<div class="list-container">
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="data"
    [totalCount]="totalCount"
    [loading]="loading"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)"
  >
    <div headerActions>
      <button mat-raised-button color="primary" (click)="createItem()">
        <mat-icon>add</mat-icon>
        Create New
      </button>
    </div>

    <ng-template #nameCell let-row let-value="value">
      <a
        class="name-link"
        [routerLink]="['/members/details', row.memberId, 'dashboard']"
        (click)="$event.stopPropagation()"
      >
        {{ row.firstName }} {{ row.lastName }}
      </a>
    </ng-template>

    <ng-template #emailCell let-row let-value="value">
      <div class="email-cell">
        <span class="email-text">{{ value }}</span>
        <button
          mat-icon-button
          class="copy-icon-button"
          type="button"
          (click)="copyEmail(value); $event.stopPropagation()"
          matTooltip="Copy email"
          aria-label="Copy email"
        >
          <mat-icon class="copy-icon">content_copy</mat-icon>
        </button>
      </div>
    </ng-template>
  </shared-ui-data-table>
</div>
