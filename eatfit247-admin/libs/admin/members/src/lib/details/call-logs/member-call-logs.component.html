@if (loading) {
  <shared-ui-loader></shared-ui-loader>
}
@if (!loading && callLogs.length > 0) {
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="callLogs">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addCallLog()">
        <mat-icon>add</mat-icon>
        Add Call Log
      </button>
    </div>
  </shared-ui-data-table>
}
@if (!loading && callLogs.length === 0) {
  <shared-ui-empty-state
    [type]="EmptyStateType.MEMBER_CALL_LOGS"
    buttonLabel="Add Call Log"
    buttonIcon="add"
    (buttonClick)="addCallLog()">
  </shared-ui-empty-state>
}
