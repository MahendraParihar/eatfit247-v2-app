<div class="complete-call-log-dialog">
  <div class="dialog-header">
    <div class="icon-wrapper">
      <mat-icon class="success-icon">check_circle</mat-icon>
    </div>
    <h2 mat-dialog-title>Mark Call as Completed</h2>
  </div>

  <mat-dialog-content>
    <p class="dialog-message">Please provide a reason for marking this call as completed.</p>
    
    <form [formGroup]="formGroup">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Completion Reason</mat-label>
        <textarea
          matInput
          formControlName="reason"
          rows="4"
          placeholder="Enter the reason for completion"
          [maxlength]="250"
        ></textarea>
        <mat-hint align="end">
          {{ formGroup.get('reason')?.value?.length || 0 }}/250
        </mat-hint>
        <shared-ui-input-error [control]="formGroup.get('reason')"></shared-ui-input-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" class="cancel-button">
      Cancel
    </button>
    <button mat-raised-button color="primary" (click)="onConfirm()" class="confirm-button" [disabled]="formGroup.invalid">
      Mark as Completed
    </button>
  </mat-dialog-actions>
</div>
