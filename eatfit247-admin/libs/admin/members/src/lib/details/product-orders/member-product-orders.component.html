<div class="product-orders-container">
  @if (loading) {
    <shared-ui-loader></shared-ui-loader>
  }
  @if (!loading && productOrders.length > 0) {
    <shared-ui-data-table
      [config]="tableConfig"
      [data]="productOrders">
      <div headerActions>
        <button mat-raised-button color="primary" (click)="addProductOrder()" [disabled]="!memberId || loading">
          <mat-icon>add</mat-icon>
          Add Product Order
        </button>
      </div>
    </shared-ui-data-table>
  }
  @if (!loading && productOrders.length === 0) {
    <shared-ui-empty-state
      [type]="EmptyStateType.GENERAL"
      buttonLabel="Add Product Order"
      buttonIcon="add"
      (buttonClick)="addProductOrder()">
    </shared-ui-empty-state>
  }
</div>
