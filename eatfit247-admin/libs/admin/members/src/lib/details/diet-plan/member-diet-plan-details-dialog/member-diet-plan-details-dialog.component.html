<h4>Diet Plan - Cycle {{dietPlanDetail.cycleNo}}
  ({{dietPlanDetail.startDate | date:'shortDate'}})</h4>
<mat-dialog-content class="diet-plan-dialog">
  <table mat-table *ngIf="dietPlanDetail && dietPlanDetail.dietPlan" [dataSource]="dietPlanDetail.dietPlan" class="dp-table">
    <ng-container matColumnDef="category">
      <th *matHeaderCellDef mat-header-cell> Recipe Category</th>
      <td *matCellDef="let item" mat-cell><strong>{{item.recipeCategory}}</strong></td>
    </ng-container>
    <ng-container matColumnDef="detail">
      <th *matHeaderCellDef mat-header-cell>Details</th>
      <td *matCellDef="let item" mat-cell>
        <div [innerHTML]="item.dietDetail"></div>
      </td>
    </ng-container>
    <ng-container matColumnDef="recipes">
      <th *matHeaderCellDef mat-header-cell> Recipes</th>
      <td *matCellDef="let item" mat-cell>
        <ul *ngIf="item.recipeList">
          <li *ngFor="let r of item.recipeList">{{r.label || r.name}}</li>
        </ul>
      </td>
    </ng-container>
    <tr *matHeaderRowDef="displayColumns;sticky: true" mat-header-row></tr>
    <tr *matRowDef="let myRowData; columns: displayColumns" mat-row></tr>
  </table>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="onClose()" class="round-btn" mat-raised-button>
    Close
  </button>
  <button (click)="sendEmail()" class="round-btn gradient-btn" color="primary" mat-raised-button>
    Send Mail
  </button>
  <button (click)="downloadDietPlan()" class="round-btn gradient-btn" color="primary" mat-raised-button>
    Download
  </button>
</mat-dialog-actions>
