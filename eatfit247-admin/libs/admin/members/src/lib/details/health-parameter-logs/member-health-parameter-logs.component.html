@if (loading) {
  <shared-ui-loader></shared-ui-loader>
}
@if (!loading && healthParameterLogs.length > 0) {
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="healthParameterLogs">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addBodyStatsLog()">
        <mat-icon>add</mat-icon>
        Add Body Stats Log
      </button>
    </div>
  </shared-ui-data-table>
}
@if (!loading && healthParameterLogs.length === 0) {
  <shared-ui-empty-state
    [type]="EmptyStateType.MEMBER_HEALTH_PARAMETER_LOGS">
  </shared-ui-empty-state>
}
