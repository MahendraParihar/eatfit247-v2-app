@if (loading) {
  <lib-loader></lib-loader>
}
@if (!loading && healthParameterLogs.length > 0) {
  <app-data-table
    [config]="tableConfig"
    [data]="healthParameterLogs">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addBodyStatsLog()">
        <mat-icon>add</mat-icon>
        Add Body Stats Log
      </button>
    </div>
  </app-data-table>
}
@if (!loading && healthParameterLogs.length === 0) {
  <lib-empty-state
    [type]="EmptyStateType.MEMBER_HEALTH_PARAMETER_LOGS">
  </lib-empty-state>
}
