@if (loading) {
  <lib-loader></lib-loader>
}
@if (!loading && issues.length > 0) {
  <app-data-table
    [config]="tableConfig"
    [data]="issues">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addIssue()">
        <mat-icon>add</mat-icon>
        Add Issue
      </button>
    </div>
  </app-data-table>
}
@if (!loading && issues.length === 0) {
  <lib-empty-state
    [type]="EmptyStateType.MEMBER_ISSUES">
  </lib-empty-state>
}
