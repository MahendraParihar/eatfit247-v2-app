<div class="dialog-container">
  <h2 mat-dialog-title>Manage Pocket Guides</h2>
  
  <mat-dialog-content>
    @if (loading) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <table mat-table [dataSource]="dataSource" class="pocket-guide-table">
        <!-- Select Column -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
              (change)="toggleAllSelection()"
              [checked]="isAllSelected()"
              [indeterminate]="isIndeterminate()"
              [aria-label]="'Select all'">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let pocketGuide">
            <mat-checkbox
              (change)="toggleSelection(pocketGuide)"
              [checked]="pocketGuide.isSelected"
              [aria-label]="'Select ' + pocketGuide.pocketGuide">
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- Pocket Guide Name Column -->
        <ng-container matColumnDef="pocketGuide">
          <th mat-header-cell *matHeaderCellDef>Pocket Guide Name</th>
          <td mat-cell *matCellDef="let pocketGuide">{{ pocketGuide.pocketGuide }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" [disabled]="loading">Cancel</button>
    <button mat-raised-button color="primary" (click)="onUpdate()" [disabled]="loading">
      Update
    </button>
  </mat-dialog-actions>
</div>
