@if (loading) {
  <shared-ui-loader></shared-ui-loader>
}
@if (!loading && pocketGuides.length > 0) {
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="pocketGuides">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addPocketGuide()">
        <mat-icon>add</mat-icon>
        Add Pocket Guide
      </button>
    </div>
  </shared-ui-data-table>
}
@if (!loading && pocketGuides.length === 0) {
  <shared-ui-empty-state
    [type]="EmptyStateType.MEMBER_POCKET_GUIDE">
  </shared-ui-empty-state>
}
