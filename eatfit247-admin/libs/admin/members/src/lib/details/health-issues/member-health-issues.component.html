@if (loading) {
  <shared-ui-loader></shared-ui-loader>
}
@if (!loading && healthIssues.length > 0) {
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="healthIssues">
    <div headerActions>
      <button mat-raised-button color="primary" (click)="addHealthIssue()">
        <mat-icon>add</mat-icon>
        Add Health Issue
      </button>
    </div>
  </shared-ui-data-table>
}
@if (!loading && healthIssues.length === 0) {
  <shared-ui-empty-state
    [type]="EmptyStateType.MEMBER_HEALTH_ISSUES">
  </shared-ui-empty-state>
}
