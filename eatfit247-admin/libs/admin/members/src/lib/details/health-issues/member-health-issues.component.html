@if (loading) {
  <lib-loader></lib-loader>
}
@if (!loading && healthIssues.length > 0) {
  <app-data-table
    [config]="tableConfig"
    [data]="healthIssues">
  </app-data-table>
}
@if (!loading && healthIssues.length === 0) {
  <lib-empty-state
    [type]="EmptyStateType.MEMBER_HEALTH_ISSUES">
  </lib-empty-state>
}
