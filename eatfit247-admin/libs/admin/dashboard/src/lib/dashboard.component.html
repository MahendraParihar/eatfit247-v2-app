<div class="dashboard-container">
  @if (loading) {
    <div class="dashboard-loading">
      <span>Loading dashboard...</span>
    </div>
  } @else if (useAnnualDashboard) {
    <lib-annual-dashboard />
  } @else if (widgetEntries.length === 0) {
    <div class="dashboard-empty">
      <span>No dashboard widgets available for your role.</span>
    </div>
  } @else {
    <div class="dashboard-grid">
      @for (entry of widgetEntries; track entry.config.id) {
        <div class="widget-cell" [attr.data-size]="entry.config.size">
          <ng-container *ngComponentOutlet="entry.component" />
        </div>
      }
    </div>
  }
</div>
