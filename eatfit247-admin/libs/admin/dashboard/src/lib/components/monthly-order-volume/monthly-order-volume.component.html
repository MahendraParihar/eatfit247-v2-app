<mat-card class="monthly-order-volume-card">
  <mat-card-header>
    <mat-card-title>Monthly Order Volume</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (loading) {
      <shared-ui-loader></shared-ui-loader>
    } @else if (!data.length) {
      <shared-ui-empty-state
        title="No Order Volume Data"
        description="Monthly order volume data is not available at the moment."
        icon="bar_chart"
      ></shared-ui-empty-state>
    } @else {
      <div #chartContainer class="chart-container"></div>
    }
  </mat-card-content>
</mat-card>
