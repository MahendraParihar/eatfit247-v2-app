<div class="list-container">
  <shared-ui-data-table
    [config]="tableConfig"
    [data]="data"
    [totalCount]="totalCount"
    [loading]="loading"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)"
  >
    <div headerActions class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Special Program</mat-label>
        <mat-select
          [(ngModel)]="isSpecialProgramFilter"
          (selectionChange)="onSpecialProgramFilterChange()"
        >
          <mat-option [value]="null">All</mat-option>
          <mat-option [value]="true">Yes</mat-option>
          <mat-option [value]="false">No</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="createItem()">
        <mat-icon>add</mat-icon>
        Create New
      </button>
    </div>
  </shared-ui-data-table>
</div>
