<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input
            matInput
            formControlName="name"
            placeholder="Enter name"
            [maxlength]="255"
            required
          />
          <mat-hint align="end">
            {{ formGroup.get('name')?.value?.length || 0 }}/255
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('name')" controlName="Name"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input
            matInput
            formControlName="title"
            placeholder="Enter title"
            [maxlength]="255"
            required
          />
          <mat-hint align="end">
            {{ formGroup.get('title')?.value?.length || 0 }}/255
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('title')" controlName="Title"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Date</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="date"
            placeholder="Select date"
            required
          />
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <shared-ui-input-error [control]="formGroup.get('date')" controlName="Date"></shared-ui-input-error>
        </mat-form-field>

        <div class="full-width">
          <label class="editor-label">Description</label>
          @if (editor) {
            <div class="NgxEditor__Wrapper">
              <ngx-editor-menu [editor]="editor"></ngx-editor-menu>
              <ngx-editor
                [editor]="editor"
                formControlName="description"
                placeholder="Enter description"
              ></ngx-editor>
            </div>
          }
          <shared-ui-input-error [control]="formGroup.get('description')" controlName="Description"></shared-ui-input-error>
        </div>

        <shared-ui-upload-form
          [formGroup]="formGroup"
          [isMultiFile]="false"
          [isRequired]="true"
          [uploadedMediaList]="initialData && initialData.imagePath ? initialData.imagePath : []"
          controlName="imagePath"
          [mediaFor]="mediaFor"
          [mediaType]="mediaType"
        ></shared-ui-upload-form>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <shared-ui-input-error [control]="formGroup.get('active')" controlName="Status"></shared-ui-input-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
