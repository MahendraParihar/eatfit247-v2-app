<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>Title</mat-label>
          <input
            matInput
            formControlName="title"
            placeholder="Enter legal page title"
          />
          @if (getMaxLength('title')) {
            <mat-hint align="end">
              {{ getCurrentLength('title') }}/{{ getMaxLength('title') }}
            </mat-hint>
          }
          <shared-ui-input-error [control]="formGroup.get('title')" controlName="Title"></shared-ui-input-error>
        </mat-form-field>

        <div class="full-width">
          <label class="editor-label">Details</label>
          @if (editor) {
            <div class="NgxEditor__Wrapper">
              <ngx-editor-menu [editor]="editor"></ngx-editor-menu>
              <ngx-editor
                [editor]="editor"
                formControlName="details"
                placeholder="Enter legal page details"
              ></ngx-editor>
            </div>
          }
          <shared-ui-input-error [control]="formGroup.get('details')" controlName="Details"></shared-ui-input-error>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Inactive</mat-option>
          </mat-select>
          <shared-ui-input-error [control]="formGroup.get('active')" controlName="Status"></shared-ui-input-error>
        </mat-form-field>

        <div class="full-width">
          <label class="upload-label">Legal Page Image</label>
          <shared-ui-upload-form
            [formGroup]="formGroup"
            [isMultiFile]="false"
            [isRequired]="false"
            [uploadedMediaList]="getImagePathList()"
            controlName="imagePath"
            [mediaFor]="mediaFor"
            [mediaType]="mediaType"
          ></shared-ui-upload-form>
        </div>

        <shared-ui-seo-form
          [formGroup]="formGroup"
          [seo]="initialData ? {
            url: initialData.url,
            metaTitle: initialData.metaTitle,
            metaDescription: initialData.metaDescription,
            tags: initialData.tags
          } : {}"
        ></shared-ui-seo-form>

      </div>

      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
        >
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
        >
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
