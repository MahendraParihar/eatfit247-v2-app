<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <div class="row">
          <mat-form-field class="half-width">
            <mat-label>Warehouse *</mat-label>
            <mat-select formControlName="warehouseId">
              @for (opt of warehouseOptions; track opt.id) {
                <mat-option [value]="opt.id">{{ opt.label }}</mat-option>
              }
            </mat-select>
            <shared-ui-input-error [control]="formGroup.get('warehouseId')" controlName="Warehouse"></shared-ui-input-error>
          </mat-form-field>
          <mat-form-field class="half-width">
            <mat-label>Courier Provider *</mat-label>
            <mat-select formControlName="courierProviderId">
              @for (opt of providerOptions; track opt.id) {
                <mat-option [value]="opt.id">{{ opt.label }}</mat-option>
              }
            </mat-select>
            <shared-ui-input-error [control]="formGroup.get('courierProviderId')" controlName="Courier Provider"></shared-ui-input-error>
          </mat-form-field>
        </div>
        <mat-form-field class="full-width">
          <mat-label>Provider Warehouse Name</mat-label>
          <input matInput formControlName="providerWarehouseName" placeholder="Provider warehouse name" [maxlength]="150" />
          <shared-ui-input-error [control]="formGroup.get('providerWarehouseName')" controlName="Provider Warehouse Name"></shared-ui-input-error>
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Provider Warehouse ID</mat-label>
          <input matInput formControlName="providerWarehouseId" placeholder="Provider warehouse ID" [maxlength]="100" />
        </mat-form-field>
        <div class="checkbox-group">
          <mat-checkbox formControlName="active">Active</mat-checkbox>
        </div>
      </div>
      <div class="form-actions">
        <button mat-raised-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit">Save</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
