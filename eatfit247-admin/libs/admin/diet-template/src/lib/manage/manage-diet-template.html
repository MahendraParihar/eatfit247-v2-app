<mat-card>
  <mat-card-header>
    <h2>{{ pageTitle }}</h2>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field>
          <mat-label>Diet Template</mat-label>
          <input matInput formControlName="dietTemplate" placeholder="Enter diet template name">
          <app-input-error [control]="formGroup.get('dietTemplate')!" controlName="Diet Template"></app-input-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Cycle No</mat-label>
          <input matInput type="number" formControlName="cycleNo" placeholder="Enter cycle number">
          <app-input-error [control]="formGroup.get('cycleNo')!" controlName="Cycle No"></app-input-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Day No</mat-label>
          <input matInput type="number" formControlName="dayNo" placeholder="Enter day number">
          <app-input-error [control]="formGroup.get('dayNo')!" controlName="Day No"></app-input-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>No of Cycles</mat-label>
          <input matInput type="number" formControlName="noOfCycle" placeholder="Enter number of cycles">
          <app-input-error [control]="formGroup.get('noOfCycle')!" controlName="No of Cycles"></app-input-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Days in Cycle</mat-label>
          <input matInput type="number" formControlName="noOfDaysInCycle" placeholder="Enter days in cycle">
          <app-input-error [control]="formGroup.get('noOfDaysInCycle')!" controlName="Days in Cycle"></app-input-error>
        </mat-form-field>

        <mat-checkbox formControlName="isWeekly">Is Weekly</mat-checkbox>
      </div>

      <div class="form-actions">
        <button mat-raised-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
