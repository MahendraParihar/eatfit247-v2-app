<div class="dialog-container">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit Diet Template' : 'Create Diet Template' }}</h2>
  
  <mat-dialog-content>
    <form [formGroup]="formGroup" class="diet-template-form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Diet Template</mat-label>
          <input matInput formControlName="dietTemplate" placeholder="Enter diet template name">
          <shared-ui-input-error [control]="formGroup.get('dietTemplate')!" controlName="Diet Template"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>No of Cycles</mat-label>
          <input matInput type="number" formControlName="noOfCycle" placeholder="Enter number of cycles">
          <shared-ui-input-error [control]="formGroup.get('noOfCycle')!" controlName="No of Cycles"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Days in Cycle</mat-label>
          <input matInput type="number" formControlName="noOfDaysInCycle" placeholder="Enter days in cycle">
          <shared-ui-input-error [control]="formGroup.get('noOfDaysInCycle')!" controlName="Days in Cycle"></shared-ui-input-error>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" [disabled]="loading">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading || formGroup.invalid">
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
  </mat-dialog-actions>
</div>
