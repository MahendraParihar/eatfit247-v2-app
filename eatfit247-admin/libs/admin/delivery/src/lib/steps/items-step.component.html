<div class="items-step-container">
  @if (!hasItems() && !loading) {
    <shared-ui-empty-state
      title="No Items Available"
      description="There are no items available for this shipment."
    />
  }

  @if (hasItems()) {
    <mat-card class="items-card">
      <mat-card-header>
        <mat-card-title>Select Items for Shipment</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="selectableGroups" class="items-table">
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>Select</th>
            <td
              mat-cell
              *matCellDef="let group; let i = index"
              [formGroup]="getItemControl(i)"
            >
              <mat-checkbox
                formControlName="selected"
                [disabled]="loading || group.quantity === 0"
                [attr.aria-label]="'Select ' + group.orderItem.productName"
              >
              </mat-checkbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef>Product Name</th>
            <td mat-cell *matCellDef="let group">
              {{ group.orderItem.productName }}
            </td>
          </ng-container>

          <ng-container matColumnDef="orderedQuantity">
            <th mat-header-cell *matHeaderCellDef>Quantity</th>
            <td mat-cell *matCellDef="let group">
              {{ group.orderItem.quantity }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  }
</div>
