<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ pageTitle }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <mat-form-field class="full-width">
          <mat-label>Role Name</mat-label>
          <input
            matInput
            type="text"
            formControlName="role"
            placeholder="Enter role name"
            [maxlength]="50"
            [minlength]="2"
          />
          <mat-hint align="end">
            {{ formGroup.get('role')?.value?.length || 0 }}/50
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('role')" controlName="Role Name"></shared-ui-input-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Role Code</mat-label>
          <input
            matInput
            type="text"
            formControlName="roleCode"
            placeholder="e.g. financial_manager"
            [maxlength]="100"
            [minlength]="2"
          />
          <mat-hint align="end">
            {{ formGroup.get('roleCode')?.value?.length || 0 }}/100
          </mat-hint>
          <shared-ui-input-error [control]="formGroup.get('roleCode')" controlName="Role Code"></shared-ui-input-error>
        </mat-form-field>

        <mat-checkbox formControlName="grantAllOnNewSubject" color="primary">
          Grant all permissions on new subjects (Super Admin flag)
        </mat-checkbox>
      </div>

      <div class="form-actions">
        <button type="button" mat-stroked-button (click)="onCancel()">
          <mat-icon>close</mat-icon>
          Cancel
        </button>
        <button type="submit" mat-raised-button color="primary">
          <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
