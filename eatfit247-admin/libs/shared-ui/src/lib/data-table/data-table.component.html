<div class="data-table-container">
  <!-- Search Bar -->
  <div class="table-header" *ngIf="config.showSearch !== false">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>{{ config.searchPlaceholder || 'Search...' }}</mat-label>
      <input
        matInput
        [(ngModel)]="searchValue"
        (ngModelChange)="onSearchChange($event)"
        placeholder="{{ config.searchPlaceholder || 'Search...' }}"
      />
      <mat-icon matPrefix>search</mat-icon>
      <button
        mat-icon-button
        matSuffix
        *ngIf="searchValue"
        (click)="onSearchChange(''); searchValue = ''"
        type="button"
      >
        <mat-icon>clear</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-overlay" *ngIf="loading">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <!-- Table -->
  <div class="table-wrapper" [class.loading]="loading">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="data-table">
      <!-- Selection Column -->
      <ng-container matColumnDef="select" *ngIf="config.selectable">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="toggleAllSelection()"
            [checked]="isAllSelected()"
            [indeterminate]="isIndeterminate()"
            [aria-label]="'Select all'"
          >
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            (change)="toggleRowSelection(row)"
            [checked]="isRowSelected(row)"
            (click)="$event.stopPropagation()"
            [aria-label]="'Select row'"
          >
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Dynamic Columns -->
      <ng-container *ngFor="let column of config.columns" [matColumnDef]="column.key">
        <!-- Header with sorting -->
        <ng-container *ngIf="column.sortable !== false">
          <th
            mat-header-cell
            *matHeaderCellDef
            [mat-sort-header]="column.key"
            [style.width]="column.width"
            [style.text-align]="column.align || 'left'"
            [class.sticky]="column.sticky"
            [class.sticky-end]="column.stickyEnd"
          >
            <ng-container *ngIf="column.headerTemplate; else defaultHeader">
              <ng-container *ngTemplateOutlet="column.headerTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultHeader>
              {{ column.label }}
            </ng-template>
          </th>
        </ng-container>
        <!-- Header without sorting -->
        <ng-container *ngIf="column.sortable === false">
          <th
            mat-header-cell
            *matHeaderCellDef
            [style.width]="column.width"
            [style.text-align]="column.align || 'left'"
            [class.sticky]="column.sticky"
            [class.sticky-end]="column.stickyEnd"
          >
            <ng-container *ngIf="column.headerTemplate; else defaultHeaderNoSort">
              <ng-container *ngTemplateOutlet="column.headerTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultHeaderNoSort>
              {{ column.label }}
            </ng-template>
          </th>
        </ng-container>

        <!-- Cell -->
        <td
          mat-cell
          *matCellDef="let row"
          [style.text-align]="column.align || 'left'"
          [class.sticky]="column.sticky"
          [class.sticky-end]="column.stickyEnd"
          [ngClass]="getRowClass(row)"
        >
          <ng-container *ngIf="column.cellTemplate; else defaultCell">
            <ng-container
              *ngTemplateOutlet="column.cellTemplate; context: { $implicit: row, column: column, value: getCellValue(row, column) }"
            ></ng-container>
          </ng-container>
          <ng-template #defaultCell>
            {{ getFormattedValue(row, column) }}
          </ng-template>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions" *ngIf="config.actions && config.actions.length > 0">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <div class="action-buttons">
            <ng-container *ngFor="let action of config.actions">
              <button
                *ngIf="isActionVisible(action, row)"
                mat-icon-button
                [color]="action.color || ''"
                [matTooltip]="action.label"
                [disabled]="isActionDisabled(action, row)"
                (click)="onActionClick(action, row, $event)"
              >
                <mat-icon *ngIf="action.icon">{{ action.icon }}</mat-icon>
                <span *ngIf="!action.icon">{{ action.label }}</span>
              </button>
            </ng-container>
          </div>
        </td>
      </ng-container>

      <!-- Header Row -->
      <ng-container *ngIf="config.showHeader !== false">
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      </ng-container>

      <!-- Data Rows -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="onRowClickHandler(row)"
        [class.clickable]="config.onRowClick || rowClick.observed"
        [ngClass]="getRowClass(row)"
      ></tr>

      <!-- Empty State -->
      <tr class="mat-row" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="empty-state">
          <ng-container *ngIf="config.emptyTemplate; else defaultEmpty">
            <ng-container *ngTemplateOutlet="config.emptyTemplate"></ng-container>
          </ng-container>
          <ng-template #defaultEmpty>
            <div class="empty-message">
              <mat-icon>inbox</mat-icon>
              <p>{{ config.emptyMessage || 'No data available' }}</p>
            </div>
          </ng-template>
        </td>
      </tr>
    </table>
  </div>

  <!-- Pagination -->
  <mat-paginator
    *ngIf="config.showPagination !== false"
    [length]="totalCount"
    [pageSize]="config.pageSize || 10"
    [pageSizeOptions]="config.pageSizeOptions || [5, 10, 25, 50, 100]"
    [pageIndex]="getPageIndex()"
    (page)="onPageChange($event)"
    showFirstLastButtons
  >
  </mat-paginator>
</div>
