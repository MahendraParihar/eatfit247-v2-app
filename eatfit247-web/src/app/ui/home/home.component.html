<div class="home">
  <!-- Hero Slider Section -->
  <section class="hero-slider-section">
    <app-image-slider
      [items]="sliderItems"
      [autoPlay]="true"
      [autoPlayInterval]="5000"
      [showArrows]="true"
      [showDots]="true"
    />
  </section>

  <!-- Journey Steps Section -->
  <section class="home-section home-section-alt">
    <app-journey-steps />
  </section>

  <!-- Product Showcase Section -->
  <section class="home-section">
    <app-product-showcase />
  </section>

  <!-- Testimonials Section -->
  <section class="home-section home-section-alt">
    <app-testimonials />
  </section>

  <!-- Blog Section Example -->
  <section class="home-section">
    <app-blog-section
      sectionTitle="Latest from Our Blog"
      sectionDescription="Discover expert insights, success stories, and wellness tips from our nutrition experts"
      [blogsToShow]="3"
      [showViewAll]="true"
      viewAllUrl="/blog"
    />
  </section>
</div>
