<div class="home">
  <!-- 1. Hero Banner Section -->
  <section class="hero-slider-section">
    <app-image-slider
      [items]="sliderItems"
      [autoPlay]="true"
      [autoPlayInterval]="5000"
      [showArrows]="true"
      [showDots]="true"
    />
  </section>

  <!-- 2. About Product Section -->
  <section class="home-section">
    <app-about-product />
  </section>

  <!-- 3. Program Plans Section -->
  <section class="home-section home-section-alt">
    <app-program-plans-section />
  </section>

  <!-- 4. Testimonials Section -->
  <section class="home-section">
    <app-testimonials />
  </section>

  <!-- 5. Blogs Section -->
  <section class="home-section home-section-alt">
    <app-blog-section
      sectionTitle="Latest from Our Blog"
      sectionDescription="Discover expert insights, success stories, and wellness tips from our nutrition experts"
      [blogsToShow]="3"
      [showViewAll]="true"
      viewAllUrl="/blog"
    />
  </section>

  <!-- 6. Press & Media Section -->
  <section class="home-section">
    <app-press-media-section />
  </section>

  <!-- 7. Contact Us Section -->
  <section class="home-section home-section-alt">
    <app-contact-form-section />
  </section>
</div>
