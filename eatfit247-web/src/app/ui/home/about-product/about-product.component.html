<section class="about-product-section">
  <div class="about-product-container">
    <!-- Section Header -->
    <div class="section-header">
      <h2 class="section-title">Why Choose EatFit247</h2>
      <p class="section-description">
        Transform your health with personalized nutrition plans designed just for you
      </p>
    </div>

    <!-- Features Grid -->
    <div class="features-grid">
      @for (feature of features; track feature.title) {
        <div class="feature-card">
          <div class="feature-icon-wrapper">
            <mat-icon class="feature-icon">{{ feature.icon }}</mat-icon>
          </div>
          <h3 class="feature-title">{{ feature.title }}</h3>
          <p class="feature-description">{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
