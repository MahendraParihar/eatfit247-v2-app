<section class="product-showcase-section">
  <div class="container">
    <div class="product-showcase-content">
      <!-- Column 1: Image -->
      <div class="product-showcase-image-column">
        <div class="product-showcase-image-container">
          <img
            [src]="productImage"
            [alt]="productTitle"
            class="product-showcase-image"
          />
        </div>
      </div>

      <!-- Column 2: Product Information -->
      <div class="product-showcase-info-column">
        <div class="product-showcase-info-content">
          <!-- Product Title -->
          <h1 class="product-showcase-title">{{ productTitle }}</h1>

          <!-- Product Subtitle -->
          <h2 class="product-showcase-subtitle">{{ productSubtitle }}</h2>

          <!-- Bullet Points -->
          <ul class="product-showcase-bullets">
            @for (bullet of productFeatureBullets; track $index) {
              <li class="product-showcase-bullet-item">
                <span class="bullet-number">{{ $index + 1 }}</span>
                <span class="bullet-text">{{ bullet }}</span>
              </li>
            }
          </ul>

          <!-- Tag Line -->
          <p class="product-showcase-tagline">{{ productTagLine }}</p>

          <!-- CTA Button -->
          <button
            mat-raised-button
            color="primary"
            class="product-showcase-cta-btn"
            (click)="navigateToProduct()"
          >
            View Product
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
