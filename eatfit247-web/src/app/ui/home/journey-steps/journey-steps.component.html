<section class="page-section">
  <div class="section-container journey-container">
    <!-- Left Side: Text Content -->
    <div class="journey-content">
      <div class="section-header">
        <h2 class="section-title">Journey to a Healthier You: Steps to Success</h2>
        <div class="title-divider"></div>
        <p class="section-description">
          Embarking on a path towards better health and well-being is a transformative journey that begins with small steps.
        </p>
      </div>

      <!-- Steps List -->
      <div class="steps-list">
        @for (step of steps; track step.number) {
          <div class="step-item">
            <div class="step-number">{{ step.number }}</div>
            <div class="step-content">
              <h3 class="step-title">{{ step.title }}</h3>
              <p class="step-description">{{ step.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Right Side: Image -->
    <div class="journey-image-wrapper">
      <img
        [src]="imageUrl"
        [alt]="imageAlt"
        class="journey-image"
        (error)="onImageError($event)"
      />
    </div>
  </div>
</section>
