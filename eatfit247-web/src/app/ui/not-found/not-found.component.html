<div class="not-found">
  <div class="not-found-container">
    <div class="not-found-content">
      <!-- 404 Icon/Number -->
      <div class="error-code">
        <span class="error-number">404</span>
        <mat-icon class="error-icon">search_off</mat-icon>
      </div>

      <!-- Error Message -->
      <div class="error-message">
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
          Oops! The page you're looking for doesn't exist or has been moved.
          Let's get you back on track to your wellness journey.
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <a mat-raised-button color="primary" routerLink="/" class="home-button">
          <mat-icon>home</mat-icon>
          Go to Homepage
        </a>
        <button mat-stroked-button (click)="goBack()" class="back-button">
          <mat-icon>arrow_back</mat-icon>
          Go Back
        </button>
      </div>

      <!-- Helpful Links -->
      <div class="helpful-links">
        <p class="links-title">You might be looking for:</p>
        <ul class="links-list">
          <li><a routerLink="/our-programs">Our Programs</a></li>
          <li><a routerLink="/product">Products</a></li>
          <li><a routerLink="/blog">Blog</a></li>
          <li><a routerLink="/contact-us">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
