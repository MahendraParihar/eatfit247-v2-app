@if (links.length > 0) {
  <div class="social-icons" [class.horizontal]="orientation === 'horizontal'" [class.vertical]="orientation === 'vertical'">
    @for (link of links; track link.name) {
      <a
        [href]="link.url"
        (click)="openSocialLink(link.url); $event.preventDefault()"
        class="social-link"
        [class.small]="size === 'small'"
        [class.medium]="size === 'medium'"
        [class.large]="size === 'large'"
        [attr.aria-label]="'Follow on ' + link.name"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          [src]="link.icon"
          [alt]="link.name + ' icon'"
          class="social-icon"
          loading="lazy"
        />
        @if (showLabels) {
          <span class="social-label">{{ link.name }}</span>
        }
      </a>
    }
  </div>
}
