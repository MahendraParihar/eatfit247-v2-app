@if (banners.length > 0) {
  <app-banner [banners]="banners"></app-banner>
}

<div class="our-programs-page page-container">
  <app-common-program [showReadMoreBtn]="false" [showFeature]="true"></app-common-program>

  <section class="our-programs__section our-programs__section--terms">
    <header class="our-programs__terms-header">
      <h2 class="our-programs__terms-title">
        Terms &amp; Conditions
      </h2>
    </header>

    <div class="our-programs__terms-card">
      <ul class="our-programs__terms-list">
        @for (item of termsAndConditions; track item) {
          <li
            class="our-programs__terms-item"
          >
            {{ item }}
          </li>
        }
      </ul>
    </div>
  </section>
</div>
