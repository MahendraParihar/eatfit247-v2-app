@if (isLoading()) {
  <app-loader page="default"></app-loader>
}
@if (!isLoading() && pageData) {
  <div class="legal-container page-container">
    <header class="section__header">
      <h1 class="section__title">
        {{ pageData.title }}
      </h1>
    </header>
    <section
      class="legal-section"
      [innerHTML]="pageData.details"
    ></section>
  </div>
}
