@if (loading()) {
  <app-loader page="blog-detail"></app-loader>
}
@if (!loading() && blog) {
  <section class="blog-detail-page page-container">
    <div class="blog-detail-container">
      <!-- Breadcrumb -->
      <nav class="blog-detail-breadcrumb" aria-label="Breadcrumb">
        <button
          matButton
          [type]="'button'"
          class="breadcrumb-link"
          routerLink="/blog"
        >
          Blog
        </button>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-current">Blog Details</span>
      </nav>

      <!-- Layout: main content + sidebar -->
      <div class="blog-detail-layout">
        <!-- Left column: blog content -->
        <article class="blog-detail-main">
          <!-- Featured image -->
          <figure class="blog-detail-image" *ngIf="blog.imageUrl">
            <!-- Category badge -->
            @if (blog.category) {
              <div class="section__badge">
                <span class="section__badge-text">{{ blog.category }}</span>
              </div>
            }
            <img
              [src]="blog.imageUrl"
              [alt]="blog.imageAlt || blog.title"
              loading="lazy"
            />
          </figure>

          <div class="blog-detail-content-wrapper">
            <!-- Meta row -->
            <div
              class="blog-detail-meta body-b6"
              *ngIf="blog.formattedDate || blog.readTimeMinutes"
            >
          <span class="meta-item" *ngIf="blog.formattedDate">
            {{ blog.formattedDate }}
          </span>
              <span
                class="meta-separator"
                *ngIf="blog.formattedDate && blog.readTimeMinutes"
              >
            &bull;
          </span>
              <span class="meta-item" *ngIf="blog.readTimeMinutes">
            {{ blog.readTimeMinutes }} min read
          </span>
            </div>

            <!-- Title -->
            <h1 class="blog-detail-title heading-2">
              {{ blog.title }}
            </h1>

            <!-- Content -->
            <div
              class="blog-detail-content body-b3"
              [innerHTML]="blog.safeContentHtml"
            ></div>
          </div>
        </article>

        <!-- Right column: share + related (moves below content on mobile) -->
        <aside class="blog-detail-sidebar" aria-label="Share and related articles">
          <!-- Share section -->
          <section class="share-card" aria-labelledby="share-card-title">
            <div class="share-card-header">
              <h2 id="share-card-title" class="share-card-title heading-2">
                Share with your community!
              </h2>
            </div>

            <div class="share-icons" aria-label="Share on social platforms">
              <app-social-site
                [items]="shareItems"
                aria-label="Share this blog on social media"
              ></app-social-site>
            </div>
          </section>

          <!-- Related blogs -->
          <section
            class="related-articles"
            *ngIf="relatedArticles.length > 0"
            aria-labelledby="related-articles-title"
          >
            <h2 id="related-articles-title" class="related-title heading-3">
              Related Blogs
            </h2>

            <div class="related-list">
              <article
                class="related-card"
                *ngFor="let article of relatedArticles"
              >
                <!-- Related blog title only -->
                <h3 class="related-card-title body-b4">
                  <a
                    class="related-card-title-link"
                    [routerLink]="article.linkUrl"
                  >
                    {{ article.title }}
                  </a>
                </h3>
              </article>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </section>
}
