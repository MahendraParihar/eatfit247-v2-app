<mat-toolbar class="layout__header" role="banner">
  <div class="layout__header-inner">
    <!-- Logo -->
    <a class="layout__brand" routerLink="/" aria-label="EatFit247 home">
      <div class="layout__brand-content">
        <img src="/logo-white.svg" alt="EatFit247 Logo" class="layout__brand-icon">
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="layout__nav layout__nav--desktop" aria-label="Main navigation">
      <a
        matButton
        routerLink="/"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <!-- About Us (dropdown) -->
      <button
        matButton
        [matMenuTriggerFor]="aboutUsMenu"
        class="layout__nav-link layout__nav-link--button"
        type="button"
        [class.layout__nav-link--active]="isAboutActive"
      >
        About Us
      </button>
      <mat-menu #aboutUsMenu="matMenu">
        <a
          mat-menu-item
          routerLink="/about-us"
          routerLinkActive="layout__nav-link--active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          About EatFit247
        </a>
        <a
          mat-menu-item
          routerLink="/about-shweta-shah"
          routerLinkActive="layout__nav-link--active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          About Shweta Shah
        </a>
      </mat-menu>

      <!-- Our Program -->
      <a
        matButton
        routerLink="/our-programs"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        Our Program
      </a>

      <!-- Product -->
      <a
        matButton
        routerLink="/product"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        Product
      </a>

      <!-- Success Stories -->
      <a
        mat-button
        routerLink="/success-stories"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        Success Stories
      </a>

      <!-- Blog -->
      <a
        matButton
        routerLink="/blog"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        Blog
      </a>

      <!-- Contact Us -->
      <a
        matButton
        routerLink="/contact-us"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        Contact Us
      </a>
    </nav>

    <!-- Desktop Get Started Button -->
    <a routerLink="/our-programs" matButton="filled" color="primary"
       class="layout__cta layout__cta--desktop primary-action-button">
      Get Started
    </a>

    <!-- Mobile Menu Button -->
    <button
      mat-icon-button
      class="layout__menu-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle navigation menu"
      aria-controls="mobile-nav"
    >
      <mat-icon [class.layout__menu-icon--open]="isMobileMenuOpen">
        {{ isMobileMenuOpen ? 'close' : 'menu' }}
      </mat-icon>
    </button>
  </div>

  <!-- Mobile Side Navigation -->
  <mat-sidenav-container class="layout__mobile-nav-container" [class.mat-drawer-opened]="isMobileMenuOpen">
    <mat-sidenav
      #mobileSidenav
      mode="over"
      position="end"
      [opened]="isMobileMenuOpen"
      (closed)="closeMobileMenu()"
      class="layout__mobile-nav-drawer"
      id="mobile-nav"
    >
      <div class="layout__mobile-nav-header">
        <a class="layout__brand layout__brand--mobile" routerLink="/" (click)="closeMobileMenu()">
          <div class="layout__brand-content">
            <img src="/logo-white.svg" alt="EatFit247 Logo" class="layout__brand-icon">
          </div>
        </a>
        <button
          mat-icon-button
          class="layout__mobile-nav-close"
          (click)="closeMobileMenu()"
          aria-label="Close navigation menu"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <nav class="layout__mobile-nav-links" aria-label="Mobile navigation">
        <a
          routerLink="/"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
        >
          Home
        </a>

        <!-- About Us (with sub-links) -->
        <div class="layout__mobile-group">
          <div class="layout__mobile-group-title">
            About Us
          </div>
          <a
            routerLink="/about-us"
            routerLinkActive="layout__mobile-nav-link--active"
            class="layout__mobile-nav-link layout__mobile-nav-link--child"
            (click)="closeMobileMenu()"
          >
            About EatFit247
          </a>
          <a
            routerLink="/about-shweta-shah"
            routerLinkActive="layout__mobile-nav-link--active"
            class="layout__mobile-nav-link layout__mobile-nav-link--child"
            (click)="closeMobileMenu()"
          >
            About Shweta Shah
          </a>
        </div>

        <!-- Our Program -->
        <a
          routerLink="/our-programs"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          Our Program
        </a>

        <!-- Product -->
        <a
          routerLink="/product"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          Product
        </a>

        <!-- Success Stories -->
        <a
          routerLink="/success-stories"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          Success Stories
        </a>

        <!-- Blog -->
        <a
          routerLink="/blog"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          Blog
        </a>

        <!-- Contact Us -->
        <a
          routerLink="/contact-us"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          Contact Us
        </a>

        <!-- FAQ -->
        <a
          routerLink="/faq"
          routerLinkActive="layout__mobile-nav-link--active"
          class="layout__mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          FAQ
        </a>

        <!-- Get Started CTA -->
        <a
          routerLink="/our-programs"
          mat-raised-button
          color="primary"
          class="layout__cta layout__cta--mobile primary-action-button"
          (click)="closeMobileMenu()"
        >
          Get Started
        </a>
      </nav>
    </mat-sidenav>
    <mat-sidenav-content>
      <!-- Overlay for mobile menu -->
      @if (isMobileMenuOpen) {
        <div
          class="layout__mobile-nav-overlay"
          (click)="closeMobileMenu()"
          role="button"
          tabindex="0"
          (keydown.enter)="closeMobileMenu()"
          (keydown.space)="closeMobileMenu()"
          aria-label="Close navigation menu"
        ></div>
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
</mat-toolbar>
