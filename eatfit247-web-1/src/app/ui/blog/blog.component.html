<!-- Banner Section -->
@if (banners().length > 0) {
  <app-banner [banners]="banners()"></app-banner>
}

<div class="blog-page page-container">
  <!-- Loading State -->
  @if (loading()) {
    <app-loader page="blog"></app-loader>
  }

  <!-- Blogs Grid -->
  @if (!loading() && blogs().length > 0) {
    <div class="blogs-grid">
      @for (blog of blogs(); track blog.id) {
        <app-card [data]="blog"></app-card>
      }
    </div>
  }

  <!-- Pagination -->
  @if (!loading() && totalBlogs() > pageSize()) {
    <div class="blog-pagination">
      <mat-paginator
        [length]="totalBlogs()"
        [pageSize]="pageSize()"
        [pageIndex]="currentPage()"
        [pageSizeOptions]="[6, 12, 24, 48]"
        (page)="onPageChange($event)"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  }
</div>
