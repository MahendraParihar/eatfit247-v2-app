@if (loading()) {
    <app-loader page="home"></app-loader>
}
@if (!loading()) {
    @if (banners.length > 0) {
        <app-banner [banners]="banners"></app-banner>
    }

    <!-- Trust Bar -->
    <div class="home-trust-bar">
        <div class="home-trust-bar__inner">
            @for (stat of trustStats; track stat.label) {
                <div class="home-trust-bar__item">
                    <span class="home-trust-bar__value">{{ stat.value }}</span>
                    <span class="home-trust-bar__label">{{ stat.label }}</span>
                </div>
            }
        </div>
    </div>

    <h1 class="visually-hidden">EatFit247 — Personalized Nutrition & Wellness Programs</h1>
    <div class="home-page__section page-container">
        <!-- Programs -->
        <app-common-program [showFeature]="false" [showReadMoreBtn]="true"></app-common-program>

        <div class="home-page__divider" aria-hidden="true"></div>

        <!-- Hall of Fame -->
        <app-home-hall-of-fame [stories]="stories"></app-home-hall-of-fame>

        <div class="home-page__divider" aria-hidden="true"></div>

        <!-- From Our Blog -->
        <app-common-blog></app-common-blog>
    </div>
}
