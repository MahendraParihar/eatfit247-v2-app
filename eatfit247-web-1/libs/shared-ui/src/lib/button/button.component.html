<!-- Using ngSwitch for SSR compatibility - prevents hydration errors -->
<ng-container [ngSwitch]="variant">
  <!-- Primary Button -->
  <ng-container *ngSwitchCase="'primary'">
    <button
      mat-flat-button
      [type]="type"
      [disabled]="isDisabled"
      [color]="materialColor"
      [attr.aria-disabled]="isDisabled"
      [class]="buttonClass"
      (click)="onButtonClick($event)">
      @if (loading) {
        <mat-spinner diameter="20" mode="indeterminate" aria-label="Loading" class="app-button__spinner"></mat-spinner>
      }
      @if (iconStart) {
        <mat-icon class="app-button__icon-start">{{ iconStart }}</mat-icon>
      }
      <ng-content></ng-content>
      @if (iconEnd) {
        <mat-icon class="app-button__icon-end">{{ iconEnd }}</mat-icon>
      }
    </button>
  </ng-container>

  <!-- Secondary Button -->
  <ng-container *ngSwitchCase="'secondary'">
    <button
      mat-stroked-button
      [type]="type"
      [disabled]="isDisabled"
      [color]="materialColor"
      [attr.aria-disabled]="isDisabled"

      @if (loading) {

      @if (iconStart) {

      <ng-content></ng-content>

    </button>
  </ng-container>
