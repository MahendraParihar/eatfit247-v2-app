<div class="app-loader" role="status" aria-live="polite">
  <div class="app-loader__spinner">
    <div class="app-loader__circle app-loader__circle--outer"></div>
    <div class="app-loader__circle app-loader__circle--inner"></div>
  </div>

  <div class="app-loader__content">
    <p class="app-loader__label body-b4">Please wait</p>
    <p class="app-loader__tagline body-b3">
      {{ currentTagline() }}
    </p>
  </div>
</div>
