<div class="social-site_list">
  @for (item of items; track item.link || $index; let i = $index) {
    @switch (item.type || type) {
      @case ('external') {
        <!-- External link -->
        <a
          class="social-site"
          [href]="item.link"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="ariaLabel(item)"
          (click)="onClick($event, item, i)"
        >
          <img
            class="social-site__icon"
            [src]="iconSrc(item)"
            [alt]="ariaLabel(item)"
          />
        </a>
      }
      @case ('internal') {
        <!-- Internal router link -->
        <a
          class="social-site"
          [routerLink]="item.link"
          [attr.aria-label]="ariaLabel(item)"
          (click)="onClick($event, item, i)"
        >
          <img
            class="social-site__icon"
            [src]="iconSrc(item)"
            [alt]="ariaLabel(item)"
          />
        </a>
      }
      @default {
        <!-- Fallback to external if type is unknown -->
        <a
          class="social-site"
          [href]="item.link"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="ariaLabel(item)"
          (click)="onClick($event, item, i)"
        >
          <img
            class="social-site__icon"
            [src]="iconSrc(item)"
            [alt]="ariaLabel(item)"
          />
        </a>
      }
    }
  }
</div>
