services:
  public-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    image: eatfit-server
    container_name: eatfit-public-api
    command: sh -c "cd server_1 && node dist/apps/public-api/main.js"
    restart: always
    volumes:
      - assets:/home/app/assets
    env_file:
      - main.env
    environment:
      API_PORT: '3000'
    ports:
      - "3000:3000"
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3000/api/v2/public/health' ]
      interval: 20s
      retries: 5
      start_period: 5s
      timeout: 10s
  admin-api:
    image: eatfit-server
    container_name: eatfit-admin-api
    command: sh -c "cd server_1 && node dist/apps/admin-api/main.js"
    restart: always
    volumes:
      - assets:/home/app/assets
    env_file:
      - main.env
    environment:
      API_PORT: '3000'
    ports:
      - "3001:3001"
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3001/api/v2/admin/health' ]
      interval: 20s
      retries: 5
      start_period: 5s
      timeout: 10s
