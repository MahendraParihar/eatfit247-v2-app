server {
   include mime.types;
   types {
     application/javascript mjs;
   }

   listen 443 ssl;
   http2 on;
   ssl_protocols TLSv1.2 TLSv1.3;
   ssl_session_cache shared:MozSSL:10m;
   ssl_session_timeout  1d;
   ssl_prefer_server_ciphers off;
   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
   ssl_certificate /etc/ssl/certs/eatfit24by7.pem;
   ssl_certificate_key /etc/ssl/certs/eatfit24by7.key;
   ssl_session_tickets off;
   server_name eatfit24by7.com;
   #access_log /var/log/nginx/access-kibana.log;
   #error_log /var/log/nginx/error-kibana.log;
   ssl_stapling off;
   ssl_stapling_verify off;
   client_max_body_size 8192M;
   add_header Content-Security-Policy "default-src 'self' https: blob: data:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; frame-src 'self' https:; frame-ancestors 'self' https://eatfit24by7.com https://eatfit24by7.com; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com;" always;
   add_header X-Content-Type-Options "nosniff" always;
   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
   add_header 'Access-Control-Allow-Origin' "https://eatfit24by7.com";
   add_header 'Cache-Control' "no-store";
   add_header 'Access-Control-Allow-Methods' "GET, POST";
   add_header X-Robots-Tag all;
   resolver 127.0.0.11;
   gzip on;
   gzip_http_version 1.1;
   gzip_disable      "MSIE [1-6]\.";
   gzip_min_length   256;
   gzip_vary         on;
   gzip_proxied      expired no-cache no-store private auth;
   gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
   gzip_comp_level   9;

   # Proxy to SSR server running on localhost:4001 (same container)
   # Static assets are served by the SSR server with proper caching
   
   # Static assets - proxy to SSR server (which serves them with proper caching)
   location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|xml)$ {
     proxy_pass http://localhost:4001;
     proxy_http_version 1.1;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     # Cache static assets
     proxy_cache_valid 200 60m;
     add_header Cache-Control "public, max-age=3600";
   }

   location ~ .*remoteEntry\.mjs {
     proxy_pass http://localhost:4001;
     proxy_http_version 1.1;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     expires -1;
     add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
   }

   # All other requests (including SSR routes) go to SSR server
   location / {
     proxy_pass http://localhost:4001;
     proxy_http_version 1.1;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     proxy_set_header Connection "";
     proxy_buffering off;
     proxy_read_timeout 300s;
     proxy_connect_timeout 75s;
     limit_except GET POST {
       deny  all;
     }
   }

   location ^~ /media-files {
      proxy_pass http://admin-api:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/v2/public {
      proxy_pass http://public-api:3000/api/v2/public;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300;
    }
}

